<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#9c4f35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/32.png">
<link rel="apple-touch-icon" href="iconos/180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Secciones">
    <div class="logo" title="Planner">P</div>
    <button data-vista="inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-vista="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></svg>Calendario</button>
    <button data-vista="tareas"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>Tareas</button>
    <button data-vista="descarga"><svg viewBox="0 0 24 24"><path d="M9.5 3a4.5 4.5 0 0 0-4.4 5.5A4 4 0 0 0 6 16h1v4l4-4h4.5a4.5 4.5 0 0 0 1.3-8.8A5 5 0 0 0 9.5 3z"/></svg>Descarga</button>
    <button data-vista="objetivos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Objetivos</button>
    <button data-vista="redes"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="m10 9 4.5 2.5L10 14z"/></svg>Redes</button>
    <button data-vista="casa"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.6 11.2A2 2 0 0 1 16.4 20H7.6a2 2 0 0 1-2-1.8z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>Casa</button>
    <button data-vista="eventos"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8L3.5 9.2l5.9-.9z"/></svg>Eventos</button>
    <button data-vista="turnos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Turnos</button>
    <button data-vista="ajustes" class="abajo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>
  <main id="main">
    <section class="vista" id="v-inicio"></section>
    <section class="vista" id="v-calendario"></section>
    <section class="vista" id="v-tareas"></section>
    <section class="vista" id="v-descarga"></section>
    <section class="vista" id="v-objetivos"></section>
    <section class="vista" id="v-redes"></section>
    <section class="vista" id="v-casa"></section>
    <section class="vista" id="v-eventos"></section>
    <section class="vista" id="v-turnos"></section>
    <section class="vista" id="v-ajustes"></section>
  </main>
</div>
<button class="fab" id="fab" title="Nueva tarea" aria-label="Nueva tarea"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="avisos" aria-live="polite"></div>
<script src="base.js"></script>
<script src="datos.js"></script>
<script src="editor.js"></script>
<script src="v-inicio.js"></script>
<script src="v-tareas.js"></script>
<script src="v-calendario.js"></script>
<script src="v-descarga.js"></script>
<script src="v-objetivos.js"></script>
<script src="v-redes.js"></script>
<script src="v-casa.js"></script>
<script src="v-eventos.js"></script>
<script src="v-turnos.js"></script>
<script src="v-ajustes.js"></script>
<script src="google.js"></script>
<script src="arranque.js"></script>
</body>
</html>
