<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novelia Studio</title>
<meta name="novelia-studio" content="app">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Novelia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/32.png">
<link rel="apple-touch-icon" href="iconos/180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail">
    <div class="logo" title="Novelia Studio">N</div>
    <button data-vista="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-vista="escribir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14 6l3 3"/></svg>Escribir</button>
    <button data-vista="leer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg>Leer</button>
    <button data-vista="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 4-7 5 9"/><path d="M3 21h18"/></svg>Plan</button>
    <button data-vista="publicar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0-4 4m4-4 4 4"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>Publicar</button>
    <button data-vista="libreta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Libreta</button>
    <button data-vista="tablero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Tablero</button>
    <button data-vista="personajes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>Personajes</button>
    <button data-vista="lexico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg>Léxico</button>
    <button data-vista="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.5.5-2.5 1.5-3.5C9.5 9 11 9 11 6c0-1.5.3-2.8 1-4z"/><path d="M6 15a6 6 0 0 0 12 0"/></svg>Progreso</button>
    <button data-vista="retos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Retos</button>
    <button data-vista="ajustes" class="abajo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>

  <main>
    <section class="vista inicio" id="v-inicio"></section>

    <section class="vista escribir" id="v-escribir">
      <aside class="arbol">
        <div class="cab">
          <div class="fila sep">
            <input class="proyecto" id="titulo-proyecto" spellcheck="false" aria-label="Título de la novela">
            <button class="icono" id="btn-proyectos" title="Cambiar de novela o crear otra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
          <div class="total num" id="total-proyecto"></div>
          <div class="barra"><i id="barra-proyecto"></i></div>
        </div>
        <div class="lista" id="lista-nodos"></div>
        <div class="acciones">
          <button class="btn peq" id="add-cap">+ Capítulo</button>
          <button class="btn peq" id="add-esc">+ Escena</button>
          <button class="btn peq" id="add-parte">+ Parte</button>
        </div>
      </aside>

      <div class="centro">
        <div class="barra-sup">
          <div class="miga" id="miga"></div>
          <span class="reloj" id="reloj"><span id="reloj-t">00:00</span><span id="reloj-p" style="font-weight:400;opacity:.85"></span><button id="reloj-fin">Terminar</button></span>
          <button class="btn peq" id="btn-sesion" title="Sesión de escritura con temporizador">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Sesión</button>
          <button class="btn peq" id="btn-revisar" title="Marcar repeticiones, -mente, muletillas y frases largas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 4l6 6" opacity=".0"/><path d="M3 4h7M3 8h4"/></svg>Revisar</button>
          <button class="icono" id="btn-panel" title="Mostrar u ocultar el panel derecho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
          <button class="icono" id="btn-foco" title="Modo foco (Esc para salir)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg></button>
        </div>
        <div class="hoja-wrap" id="hoja-wrap">
          <div class="hoja">
            <input class="titulo-nodo" id="titulo-nodo" spellcheck="true" aria-label="Título">
            <div class="sinopsis-mini" id="sinopsis-mini"></div>
            <div id="editor" contenteditable="true" spellcheck="true" lang="es"></div>
          </div>
        </div>
        <div class="estadisticas" id="estadisticas"></div>
      </div>

      <aside class="lateral" id="lateral">
        <div class="pestanas" id="pestanas">
          <button data-p="escena" class="on">Escena</button>
          <button data-p="revision">Revisión</button>
          <button data-p="sinonimos">Sinónimos</button>
          <button data-p="notas">Notas</button>
        </div>
        <div class="cuerpo" id="lateral-cuerpo"></div>
      </aside>
    </section>

    <section class="vista leer" id="v-leer"></section>
    <section class="vista" id="v-plan"></section>
    <section class="vista" id="v-publicar"></section>
    <section class="vista libreta" id="v-libreta"></section>
    <section class="vista" id="v-tablero"></section>
    <section class="vista personajes-v" id="v-personajes"></section>
    <section class="vista lexico" id="v-lexico"></section>
    <section class="vista progreso" id="v-progreso"></section>
    <section class="vista retos" id="v-retos"></section>
    <section class="vista ajustes" id="v-ajustes"></section>
  </main>
</div>
<script src="plataforma.js"></script>
<script src="analisis.js"></script>
<script src="data/lexico.js"></script>
<script src="data/momentos.js"></script>
<script src="tablero-comun.js"></script>
<script src="docx.js"></script>
<script src="app.js"></script>
<script src="vistas.js"></script>
<script src="vistas2.js"></script>
<script src="escaleta.js"></script>
<script src="novelia.js"></script>
<script src="vistas3.js"></script>
<script src="movil.js"></script>
</body>
</html>
